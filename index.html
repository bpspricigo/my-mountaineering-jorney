<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Mountaineering Journey</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://unpkg.com/maplibre-gl@3.2.1/dist/maplibre-gl.css" rel="stylesheet" />
</head>
<body>

  <header>
    <div class="header-inner">
      <h1>My Mountaineering Journey</h1>
      <nav>
        <button class="tab-btn active" data-tab="journal">Journal</button>
        <button class="tab-btn" data-tab="planner">Planner</button>
        <button class="tab-btn" data-tab="peaks">Peaks</button>
      </nav>
    </div>
  </header>

  <main>
    <div id="tab-journal" class="tab-content">
      <div id="journal-list"></div>
    </div>

    <div id="tab-planner" class="tab-content" hidden>
      <div class="tab-intro">
        <h2>Upcoming Adventures</h2>
        <p>Routes on the radar — planned, researched, and ready to go.</p>
      </div>
      <div id="planner-list"></div>
    </div>

    <div id="tab-peaks" class="tab-content" hidden>
      <!-- The map is the page here; everything else floats over it. -->
      <div class="peaks-stage">
        <div id="peaks-map" class="map map--peaks"></div>

        <button type="button" id="peaks-panel-toggle" class="peaks-panel-toggle"
                aria-controls="peaks-panel" aria-expanded="true" title="Hide the panel">
          <span aria-hidden="true">‹</span>
          <span class="visually-hidden">Toggle the planner panel</span>
        </button>

        <aside id="peaks-panel" class="peaks-panel" aria-label="Peak planner controls"></aside>
      </div>
    </div>

  </main>

  <script src="config.js"></script>
  <script src="https://unpkg.com/maplibre-gl@3.2.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@tmcw/togeojson"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="store.js"></script>
  <script src="routes.js"></script>
  <script src="peaks.js"></script>
  <script src="route-form.js"></script>
  <script src="route-draw.js"></script>
  <script src="app.js"></script>
</body>
</html>
