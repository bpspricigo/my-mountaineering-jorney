<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Mountaineering Journey</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://unpkg.com/maplibre-gl@3.2.1/dist/maplibre-gl.css" rel="stylesheet" />
</head>
<body>

  <!-- One page: the map is the whole of it, and everything else floats over it. -->
  <div class="peaks-stage">
    <div id="peaks-map" class="map--peaks"></div>

    <button type="button" id="peaks-panel-toggle" class="peaks-panel-toggle"
            aria-controls="peaks-panel" aria-expanded="true" title="Hide the panel">
      <span aria-hidden="true">‹</span>
      <span class="visually-hidden">Toggle the planner panel</span>
    </button>

    <aside id="peaks-panel" class="peaks-panel" aria-label="Peak planner controls"></aside>
  </div>

  <script src="config.js"></script>
  <script src="https://unpkg.com/maplibre-gl@3.2.1/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="store.js"></script>
  <script src="routes.js"></script>
  <script src="peaks.js"></script>
  <script src="route-form.js"></script>
  <script src="route-draw.js"></script>
  <script src="app.js"></script>
</body>
</html>
